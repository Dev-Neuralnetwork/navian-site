<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Navian Digital">
  <title>Navian Digital</title>
  <!-- Outlined letterform, not a stroked polyline: the diagonal is cut flat at
       cap line and baseline the way a real N is, so there are no miter spikes
       and the shape rasterises identically at every size. -->
  <path d="M22 24.3 H39.5 L65.2 61.7 V24.3 H78 V75.7 H59.3 L34.8 40.7 V75.7 H22 Z"
        fill="currentColor"/>
</svg>
